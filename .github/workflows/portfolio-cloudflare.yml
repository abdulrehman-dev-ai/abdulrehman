name: Cloudflare portfolio checks
on:
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/portfolio-cloudflare.yml']
  push:
    branches: [main]
    paths: ['cloudflare/**', '.github/workflows/portfolio-cloudflare.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx wrangler pages functions build --outdir /tmp/portfolio-pages-build
