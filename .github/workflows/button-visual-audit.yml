name: Portfolio Button Visual Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/ActionLink.tsx'
      - 'src/components/ui/ActionLink.module.scss'
      - '.github/workflows/button-visual-audit.yml'
      - 'scripts/inspect-buttons.mjs'

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare browser
        run: |
          npm ci
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Check live rendered button design
        run: node scripts/inspect-buttons.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-button-visual-check
          path: button-check/
          retention-days: 7
