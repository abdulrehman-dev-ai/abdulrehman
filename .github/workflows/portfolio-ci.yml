name: Portfolio Production CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify D1 schema, integrity and idempotency
        run: node --test infra/d1/tests/*.test.mjs

      - name: Check bootstrap Cloudflare Worker behavior and syntax
        run: |
          node --check infra/worker/src/index.mjs
          node --test infra/worker/test/*.test.mjs
          node infra/worker/scripts/staging-migrations.mjs
          node --input-type=module -e "import { assertSafeStagingTarget } from './infra/worker/scripts/staging-migrations.mjs'; assertSafeStagingTarget(); console.log('Staging D1 binding isolation verified');"

      - name: Bundle Cloudflare Worker without deployment
        working-directory: infra/worker
        run: npx --yes wrangler@4.156.0 deploy --dry-run --outdir .wrangler/local-preview

      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        env:
          ORDER_CHECKOUT_ENABLED: 'false'
          NEXT_PUBLIC_ORDER_CHECKOUT_ENABLED: 'false'
        run: npm run build

      - name: Smoke test navigation and disabled payments
        env:
          ORDER_CHECKOUT_ENABLED: 'false'
          NEXT_PUBLIC_ORDER_CHECKOUT_ENABLED: 'false'
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/portfolio-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-portfolio.mjs
