name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/portfolio-completion-2026]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile production build
        env:
          ORDER_CHECKOUT_ENABLED: 'false'
          NEXT_PUBLIC_ORDER_CHECKOUT_ENABLED: 'false'
        run: npm run build
