name: Cloudflare Workers Compatibility Scan

# Diagnostic only: no Cloudflare token, no deployment, no database or secrets.
# Runs on changes relevant to the Next.js runtime and on initial creation.
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/cloudflare-compatibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'src/**'

permissions:
  contents: read

jobs:
  vinext-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned existing dependencies
        run: npm ci
      - name: Check Next.js application against Cloudflare's vinext adapter (no changes)
        shell: bash
        run: |
          set -o pipefail
          npx --yes vinext@1.3.1 check 2>&1 | tee /tmp/cloudflare-compatibility.txt
      - name: Summarize audit
        if: always()
        run: |
          {
            echo '## Cloudflare/Next.js compatibility diagnostics'
            echo 'Adapter: vinext 1.3.1 (read-only check)'
            echo 'No deployment and no secrets.'
            echo 'See the compatibility step output for findings.'
          } >> "$GITHUB_STEP_SUMMARY"
