name: One-time Archive and Clean Legacy Branches
on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/legacy-branch-cleanup.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  cleanup:
    if: >-
      ${{ github.event.head_commit.message == 'chore: archive and remove legacy portfolio branches' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safely archive legacy heads, close outdated drafts, and remove branches
        uses: actions/github-script@v7
        with:
          script: |
            const plan = [
              {
                "name": "feat/lead-inquiries-resend-20261029",
                "sha": "015f8749ae11f10b0a0766aa138f2ea40dca2d38",
                "tag": "archive/2026-10-31/lead-inquiries-resend",
                "pr": 3
              },
              {
                "name": "feature/cloudflare-portfolio-platform",
                "sha": "ae8b029621b10bb8781dbd022c8fe6c9222dd5f2",
                "tag": "archive/2026-10-31/cloudflare-portfolio-platform",
                "pr": 1
              },
              {
                "name": "feature/portfolio-completion-2026",
                "sha": "bc7fff19abcb76c51e422fcebd5b506682a0106d",
                "tag": "archive/2026-10-31/portfolio-completion",
                "pr": 2
              },
              {
                "name": "feature/real-client-showcase-2026",
                "sha": "5566ee0774c221d8c0c964a9569167137161dcd5",
                "tag": "archive/2026-10-31/real-client-showcase",
                "pr": null
              }
            ];
            const {owner, repo} = context.repo;
            if (context.ref !== 'refs/heads/staging') throw new Error('Cleanup must only run from staging');
            for (const p of plan) {
              const {data: ref} = await github.rest.git.getRef({owner, repo, ref: 'heads/'+p.name});
              if (ref.object.sha !== p.sha) throw new Error('Branch changed since audit: '+p.name);
              if (p.pr) {
                const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number:p.pr});
                if (pr.state !== 'open' || pr.head.ref !== p.name || pr.base.ref !== 'main' || !pr.draft)
                  throw new Error('PR state changed since audit: #'+p.pr);
              }
            }
            for (const p of plan) {
              const refName='tags/'+p.tag;
              let exists;
              try {exists=(await github.rest.git.getRef({owner,repo,ref:refName})).data.object.sha;}
              catch(e){if(e.status!==404) throw e;}
              if(exists && exists!==p.sha) throw new Error('Archive tag points to unexpected commit: '+p.tag);
              if(!exists) await github.rest.git.createRef({owner,repo,ref:'refs/'+refName,sha:p.sha});
              const {data: verified}=await github.rest.git.getRef({owner,repo,ref:refName});
              if(verified.object.sha!==p.sha) throw new Error('Archive tag verification failed: '+p.tag);
              core.info('Archived '+p.name+' as '+p.tag);
            }
            for (const p of plan.filter(x=>x.pr)) {
              const {data:pr}=await github.rest.pulls.get({owner,repo,pull_number:p.pr});
              const note='\n\n---\nArchived during two-branch repository cleanup on 2026-10-31. Original unmerged source preserved at tag `'+p.tag+'` (commit `'+p.sha+'`). No unfinished feature was silently merged. All future work continues on `staging`.';
              await github.rest.pulls.update({owner,repo,pull_number:p.pr,state:'closed',body:(pr.body||'')+note});
              core.info('Closed superseded draft PR #'+p.pr);
            }
            for (const p of plan) {
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+p.name});
              core.info('Deleted archived branch '+p.name);
            }
            const {data: remaining}=await github.rest.repos.listBranches({owner,repo,per_page:100});
            const actual=remaining.map(b=>b.name).sort();
            if(JSON.stringify(actual)!==JSON.stringify(['main','staging'])) throw new Error('Unexpected branches remain: '+actual.join(', '));
            core.info('Verified exact two-branch policy: '+actual.join(' and '));
